dummy_control:
  module: dummy_control
  class: DummyControl
  gain: 0.5
  reference_value: 22.0
  sensor: sensor.s_ec_01_2_temperature
  control_signal_topic: "ha/desktop_gf/actuators/temperature"

sensor_request_loop:
  module: sensor_request_loop
  class: MainLoop
  flag_entity: input_text.main_loop_flag

air_pump_controller:
  module: air_pump_controller
  class: Air_pump_controller
  id: input_boolean.relay_3

hsi_config_update:
  module: HSI_config_update
  class: HSIConfigUpdate
  apply_button_id: input_button.hs_apply_config

  # CAMERA
  camera_exposure_id: input_number.hs_camera_exposure
  camera_gain_id: input_number.hs_camera_gain
  camera_blacklevel_id: input_number.hs_camera_blacklevel

  # PRINTER
  printer_x_step_id: input_number.hs_printer_x_step
  printer_x_end_id: input_number.hs_printer_x_end
  printer_z_step_id: input_number.hs_printer_z_step
  printer_z_end_id: input_number.hs_printer_z_end
  printer_z_start_id: input_number.hs_printer_z_start
  printer_x_start_id: input_number.hs_printer_x_start

hsi_scheduler:
  module: HSI_scheduler
  class: HSIScheduler
  scan_time_id: input_datetime.hs_scan_time


co2_pid:
  module: co2_pid
  class: CO2PID
  co2_pid_enable_id: input_boolean.co2_pid_enable_toggle
  co2_sensor_id: sensor.co2_voc_sensor_2_co2
  co2_ref_id: input_number.co2_ref
  co2_pid_kp_id: input_number.co2_pid_kp
  co2_pid_ki_id: input_number.co2_pid_ki
  co2_pid_kd_id: input_number.co2_pid_kd
  relay_13_id: input_boolean.relay_13

cooling_pid:
  module: cooling_pid
  class: CoolingPID
  enable_id: input_boolean.cooling_pid_enable_toggle
  humid_sensor_id: sensor.sth_sensor_1_humidity_2
  ref_id: input_number.humid_ref
  kp_id: input_number.cooling_pid_kp
  ki_id: input_number.cooling_pid_ki
  kd_id: input_number.cooling_pid_kd
  fan_cmd_topic: cmd/fan_voltage/req
  valve_cmd_topic: cmd/valve_voltage/req

heating_pid:
  module: heating_pid
  class: HeatingPID
  enable_id: input_boolean.heating_pid_enable_toggle
  sensor_id: sensor.co2_voc_sensor_2_temperature
  ref_id: input_number.temp_ref
  kp_id: input_number.heating_pid_kp
  ki_id: input_number.heating_pid_ki
  kd_id: input_number.heating_pid_kd
  relay_id: input_boolean.solid_state_relay1



nutrient_delivery_controller:
  module: nutrient_delivery_controller
  class: NutrientDeliveryController
  enable_id: input_boolean.nutrient_delivery_controller

  # ───── Water level sensors ─────
  slle01_gt1_level_id: sensor.slle01_gt1_level
  slle01_gt2_level_id: sensor.slle01_gt2_level
  slle01_mx_level_id: sensor.slle01_mx_level
  slle01_fwt_level_id: sensor.slle01_fwt_level
  
  # ───── Dissolved Oxygen sensor ─────
  srjy01_id: sensor.srjy01_mgl

  # ───── EC sensors ─────
  ec_gt1_id: sensor.s_ec_01_gt1_ec
  ec_gt2_id: sensor.s_ec_01_gt2_ec
  ec_mx_id: sensor.s_ec_01_mx_ec

  # ───── Nutrient references ─────
  nutrient_1_ref_id: input_number.nutrient_1_ref
  nutrient_2_ref_id: input_number.nutrient_2_ref

  # ───── Tank capacity references ─────
  mx_capacity_liters: 200
  gt1_capacity_liters: 100
  gt2_capacity_liters: 100

  # ───── Peristaltic pump flow rates (m³/s) ─────
  peristaltic_flow_1: 0.000424
  peristaltic_flow_2: 0.000344
  peristaltic_flow_3: 0.000357

  # ───── Peristaltic pump toggles ─────
  peristaltic_1_id: input_boolean.relay_14
  peristaltic_2_id: input_boolean.relay_15

  # ───── Solenoid valves ─────
  solenoid_1_id: input_boolean.relay_11
  solenoid_2_id: input_boolean.relay_12
  
  # ───── Water pumps & valves ─────
  water_pump_350_id: input_boolean.relay_1
  water_pump_5k_id: input_boolean.relay_2


lamp1_controller:
  module: lamp_control
  class: Lamp_control
  name: "Lamp 1 Controller"
  amplitude_ids:
    - input_number.elixia_1_channel_450nm
    - input_number.elixia_1_channel_5700k
    - input_number.elixia_1_channel_660nm
    - input_number.elixia_1_channel_735nm
  set_values_ids:
    - input_number.elixia_1_set_channel_450nm
    - input_number.elixia_1_set_channel_5700k
    - input_number.elixia_1_set_channel_660nm
    - input_number.elixia_1_set_channel_735nm
  dawn_durations_ids:
    - input_number.elixia_1_dawn_duration_450nm
    - input_number.elixia_1_dawn_duration_5700k
    - input_number.elixia_1_dawn_duration_660nm
    - input_number.elixia_1_dawn_duration_735nm
  dusk_durations_ids:
    - input_number.elixia_1_dusk_duration_450nm
    - input_number.elixia_1_dusk_duration_5700k
    - input_number.elixia_1_dusk_duration_660nm
    - input_number.elixia_1_dusk_duration_735nm
  start_time_id: input_datetime.lamp1_start_time
  finish_time_id: input_datetime.lamp1_finish_time
  toggle_id: input_boolean.lamp1_control_toggle

lamp2_controller:
  module: lamp_control
  class: Lamp_control
  name: "Lamp 2 Controller"
  amplitude_ids:
    - input_number.elixia_2_channel_450nm
    - input_number.elixia_2_channel_5700k
    - input_number.elixia_2_channel_660nm
    - input_number.elixia_2_channel_735nm
  set_values_ids:
    - input_number.elixia_2_set_channel_450nm
    - input_number.elixia_2_set_channel_5700k
    - input_number.elixia_2_set_channel_660nm
    - input_number.elixia_2_set_channel_735nm
  dawn_durations_ids:
    - input_number.elixia_2_dawn_duration_450nm
    - input_number.elixia_2_dawn_duration_5700k
    - input_number.elixia_2_dawn_duration_660nm
    - input_number.elixia_2_dawn_duration_735nm
  dusk_durations_ids:
    - input_number.elixia_2_dusk_duration_450nm
    - input_number.elixia_2_dusk_duration_5700k
    - input_number.elixia_2_dusk_duration_660nm
    - input_number.elixia_2_dusk_duration_735nm
  start_time_id: input_datetime.lamp2_start_time
  finish_time_id: input_datetime.lamp2_finish_time
  toggle_id: input_boolean.lamp2_control_toggle

scan_processor:
  module: scan_processor
  class: ScanProcessor

  # Entity to watch for scan state change
  scann_status_id: sensor.hsi_scanner_status

  # Inputs for processing parameters
  band_input: input_number.hsi_band_to_plot
  pixel_x_input: input_number.hsi_pixel_x
  pixel_y_input: input_number.hsi_pixel_y
  red_band_input: input_number.hsi_red_band
  nir_band_input: input_number.hsi_nir_band

  process_button: input_button.hs_process_hsi


alarm_monitor:
  module: alarm_monitor
  class: AlarmMonitor

  # ── SMTP / email ──
  smtp_host: smtp.gmail.com
  smtp_port: 465                    # SSL port (smtplib.SMTP_SSL)
  smtp_user: !secret smtp_user      # sender
  smtp_pass: !secret smtp_pass      # app password
  recipient: !secret alarm_recipient  # receiver
  cooldown_hours: 1

  # ── Monitored HA entities ──
  entity_temperature: sensor.co2_voc_sensor_1_temperature
  entity_co2: sensor.co2_voc_sensor_2_co2
  entity_ph_mx: sensor.ph_sensor_mx_ph
  entities_water_level:
    - sensor.water_level_sensor_gt1_level_2
    - sensor.water_level_sensor_gt2_level_2
    - sensor.water_level_sensor_mx_level_2
    - sensor.water_level_sensor_fwt_level_2


lamp1_csv_schedule:
  module: lamp_csv_schedule
  class: LampCsvSchedule
  label: "Lamp 1 CSV Schedule"
  toggle_id: input_boolean.lamp1_adaptive_mode

  start_date: "TBD"  # to be modified!
  first_day: 1
  last_day: 21
  csv_file: "20260423_optimal_daily_dli.csv"
  channel_ids:
    "450nm": input_number.elixia_1_channel_450nm
    "660nm": input_number.elixia_1_channel_660nm
    "735nm": input_number.elixia_1_channel_735nm
    "5700nm": input_number.elixia_1_channel_5700k